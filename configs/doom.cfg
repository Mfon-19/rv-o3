# Validated eight-wide Doom core. Over demo frames 40..100 it runs at
# 4.075 IPC; the earlier version with the baseline predictor and a 256 KiB
# L2 ran at 3.207 (doc/doom-microarchitecture-bottlenecks.md). A 1 MiB L2
# is given a realistic 12-cycle hit latency rather than the baseline 4.
width = 8
aluCount = 8
wbPorts = 8
aguCount = 2
dataPorts = 2
fetchBytes = 64
fetchQSize = 32
robSize = 128
iqSize = 64
lsqSize = 64
sbSize = 32
physRegs = 0
btbEntries = 2048
phtBits = 13
rasEntries = 32
rasRepair = 1
btbWays = 4
tageTables = 8
tageTableBits = 11
tageMaxHist = 256
l2.size = 1m
l2.latency = 12

# Eight-wide out-of-order core configuration tuned for Doom:
# 128-entry ROB, dual AGUs/data ports, 8-table TAGE predictor, RAS repair,
# 4-way BTB, and a 1 MiB L2 cache.
width = 8
aluCount = 8
wbPorts = 8
aguCount = 2
dataPorts = 2
fetchBytes = 64
fetchQSize = 32
robSize = 128
iqSize = 64
lsqSize = 64
sbSize = 32
physRegs = 0
btbEntries = 2048
phtBits = 13
rasEntries = 32
rasRepair = 1
btbWays = 4
tageTables = 8
tageTableBits = 11
tageMaxHist = 256
l2.size = 1m
l2.latency = 12

# High-FPS Doom configuration tuned for maximum host frame rate on rvsim
# (~17-19 steady-state FPS, ~22-23 overall FPS on the 100-frame demo):
# flat 1-cycle multi-port memory, balanced 4-wide queues (2.31 IPC), dual
# branch/AGU/data ports, large direct-mapped BTB + 16-bit gshare, and bypass
# memory ordering.
flatMemory = 1
flatLatency = 1
memOrder = bypass

width = 4
aluCount = 4
branchCount = 2
wbPorts = 6
aguCount = 2
dataPorts = 2
mulLatency = 1
divLatency = 1

fetchBytes = 64
fetchQSize = 16
robSize = 14
iqSize = 7
lsqSize = 7
sbSize = 4
physRegs = 0

btbEntries = 8192
btbWays = 1
phtBits = 16
ghrBits = 14
rasEntries = 32
rasRepair = 1
tageTables = 0

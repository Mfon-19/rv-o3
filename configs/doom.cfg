# Eight-wide Doom core. TAGE handles conditional branches, RAS repair
# restores return predictions after squashes, and a four-way BTB reduces
# target conflicts. The 1 MiB L2 uses a 12-cycle hit latency.
width = 8
aluCount = 8
wbPorts = 8
aguCount = 2
dataPorts = 2
fetchBytes = 64
fetchQSize = 32
robSize = 128
iqSize = 64
lsqSize = 64
sbSize = 32
physRegs = 0
btbEntries = 2048
phtBits = 13
rasEntries = 32
rasRepair = 1
btbWays = 4
tageTables = 8
tageTableBits = 11
tageMaxHist = 256
l2.size = 1m
l2.latency = 12
